<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
@import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap');

:root {
  --rz-bg: #060b06;
  --rz-bg-light: #0f1a0f;
  --rz-gold: #c9a54a;
  --rz-gold-dim: rgba(201,165,74,0.15);
  --rz-gold-glow: rgba(201,165,74,0.3);
  --rz-text: #f2ede5;
  --rz-text-dim: rgba(242,237,229,0.6);
  --rz-border: rgba(201,165,74,0.2);
  --rz-radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

#rizalta-chat-widget {
  font-family: 'Raleway', sans-serif;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 99999;
}

/* Кнопка */
.rz-chat-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--rz-gold), #b8943f);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(201,165,74,0.4);
  transition: transform 0.3s, box-shadow 0.3s;
  animation: rz-pulse 2s ease-in-out infinite;
}
.rz-chat-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 30px rgba(201,165,74,0.6);
}
.rz-chat-btn svg { width: 28px; height: 28px; fill: var(--rz-bg); }
.rz-chat-btn.active svg.icon-chat { display: none; }
.rz-chat-btn:not(.active) svg.icon-close { display: none; }

@keyframes rz-pulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(201,165,74,0.4); }
  50% { box-shadow: 0 4px 30px rgba(201,165,74,0.7); }
}

/* Окно */
.rz-chat-window {
  display: none;
  position: fixed;
  bottom: 100px;
  right: 24px;
  width: 400px;
  height: 550px;
  background: var(--rz-bg);
  border: 1px solid var(--rz-border);
  border-radius: var(--rz-radius);
  box-shadow: 0 16px 60px rgba(0,0,0,0.6);
  flex-direction: column;
  overflow: hidden;
}
.rz-chat-window.open {
  display: flex;
  animation: rz-slide-up 0.3s ease-out;
}
@keyframes rz-slide-up {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Шапка */
.rz-header {
  padding: 16px 20px;
  background: var(--rz-bg-light);
  border-bottom: 1px solid var(--rz-border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.rz-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--rz-gold), #b8943f);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 18px;
  color: var(--rz-bg);
  flex-shrink: 0;
}
.rz-header-info h3 { font-size: 14px; font-weight: 600; color: var(--rz-text); }
.rz-header-info p { font-size: 12px; color: var(--rz-gold); font-weight: 400; }

/* Сообщения */
.rz-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.rz-messages::-webkit-scrollbar { width: 4px; }
.rz-messages::-webkit-scrollbar-track { background: transparent; }
.rz-messages::-webkit-scrollbar-thumb { background: var(--rz-border); border-radius: 2px; }

.rz-msg {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--rz-text);
  word-wrap: break-word;
}
.rz-msg.bot {
  align-self: flex-start;
  background: var(--rz-bg-light);
  border: 1px solid var(--rz-border);
  border-bottom-left-radius: 4px;
}
.rz-msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--rz-gold), #b8943f);
  color: var(--rz-bg);
  font-weight: 500;
  border-bottom-right-radius: 4px;
}
.rz-msg .rz-msg-avatar {
  display: inline-block;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--rz-gold), #b8943f);
  text-align: center;
  line-height: 24px;
  font-size: 11px;
  font-weight: 600;
  color: var(--rz-bg);
  margin-right: 6px;
  vertical-align: middle;
}

/* Typing indicator */
.rz-typing {
  display: none;
  align-self: flex-start;
  padding: 10px 14px;
  background: var(--rz-bg-light);
  border: 1px solid var(--rz-border);
  border-radius: 12px;
  border-bottom-left-radius: 4px;
  font-size: 13px;
  color: var(--rz-text-dim);
  margin: 0 16px;
}
.rz-typing.show { display: block; }
.rz-typing span { display: inline-block; animation: rz-dot 1.4s infinite; }
.rz-typing span:nth-child(2) { animation-delay: 0.2s; }
.rz-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes rz-dot {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}

/* Quick replies */
.rz-quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 16px 8px;
}
.rz-quick-btn {
  padding: 8px 14px;
  border: 1px solid var(--rz-gold);
  border-radius: 20px;
  background: transparent;
  color: var(--rz-gold);
  font-family: 'Raleway', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.rz-quick-btn:hover { background: var(--rz-gold-dim); }

/* Ввод */
.rz-input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--rz-border);
  display: flex;
  gap: 8px;
  background: var(--rz-bg-light);
}
.rz-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--rz-border);
  border-radius: 24px;
  background: var(--rz-bg);
  color: var(--rz-text);
  font-family: 'Raleway', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.rz-input::placeholder { color: var(--rz-text-dim); }
.rz-input:focus { border-color: var(--rz-gold); }
.rz-send-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--rz-gold), #b8943f);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.rz-send-btn:hover { transform: scale(1.05); }
.rz-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.rz-send-btn svg { width: 18px; height: 18px; fill: var(--rz-bg); }

/* Mobile */
@media (max-width: 480px) {
  .rz-chat-window {
    bottom: 0; right: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 0; border: none;
  }
  .rz-chat-btn { bottom: 16px; right: 16px; }
}
</style>
</head>
<body>

<div id="rizalta-chat-widget">
  <button class="rz-chat-btn" id="rzChatBtn" aria-label="Открыть чат">
    <svg class="icon-chat" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
    <svg class="icon-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>

  <div class="rz-chat-window" id="rzChatWindow">
    <div class="rz-header">
      <div class="rz-avatar">М</div>
      <div class="rz-header-info">
        <h3>Маргарита</h3>
        <p>RIZALTA Resort Belokurikha</p>
      </div>
    </div>
    <div class="rz-messages" id="rzMessages"></div>
    <div class="rz-typing" id="rzTyping">
      Маргарита печатает<span>.</span><span>.</span><span>.</span>
    </div>
    <div class="rz-quick-replies" id="rzQuickReplies"></div>
    <div class="rz-input-area">
      <input class="rz-input" id="rzInput" type="text" placeholder="Напишите сообщение..." autocomplete="off">
      <button class="rz-send-btn" id="rzSendBtn" aria-label="Отправить">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
